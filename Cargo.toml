[workspace]
resolver = "2"
members = [
    "crates/cius-ro-id",
    "crates/cius-ro",
    "crates/cius-ro-cli",
    "crates/cius-ro-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/StBogdan/ro-efactura-rust"
homepage = "https://github.com/StBogdan/ro-efactura-rust"
authors = ["Bogdan Stoicescu"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[workspace.dependencies]
cius-ro-id = { version = "0.1.0", path = "crates/cius-ro-id", default-features = false }
cius-ro = { version = "0.1.0", path = "crates/cius-ro", default-features = false }

en16931 = { version = "0.10", default-features = false }
en16931-formats = { version = "0.10", default-features = false, features = ["ubl", "cii"] }
roxmltree = "0.21"
uppsala = "0.12"
lopdf = { version = "0.44", default-features = false }
ttf-parser = "0.25"
time = { version = "0.3", default-features = false }
iban_validate = { version = "5", default-features = false }
deunicode = "1.6"
tempfile = "3"

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
clap = { version = "4.5", features = ["derive"] }
wasm-bindgen = "0.2"
proptest = "1.5"
