[package]
name = "cius-ro-id"
description = "no_std-compatible Romanian fiscal, legal, banking, and geographic identifiers (CUI/CIF, CNP + ANAF B2C placeholder, ONRC, RO IBAN, ISO 3166-2:RO & Bucharest sectors)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["romania", "cui", "cnp", "efactura", "anaf"]
categories = ["parser-implementations", "localization", "no-std", "finance"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
tsify = ["std", "serde", "dep:tsify", "dep:wasm-bindgen"]

[dependencies]
time.workspace = true
iban_validate.workspace = true
deunicode.workspace = true
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
