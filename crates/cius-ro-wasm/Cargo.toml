[package]
name = "cius-ro-wasm"
description = "WebAssembly bindings for Romanian ANAF RO e-Factura (CIUS-RO 1.0.1) validation, efactura.xml PDF/A-3 extraction, and CUI/CNP/ONRC/IBAN checking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["efactura", "cius-ro", "wasm", "webassembly", "anaf"]
categories = ["wasm", "finance", "parser-implementations"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cius-ro = { workspace = true, features = ["xsd", "pdfa3", "serde", "svrl", "wasm-js"] }
cius-ro-id = { workspace = true, features = ["std", "serde"] }
wasm-bindgen.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
